stages:
  - mirror

mirror_develop_to_github:
  stage: mirror
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  before_script:
    - apk add --no-cache git sed
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"
  script:
    # Remove GitHub remote if it already exists
    - git remote remove github || true
    # Add GitHub remote using variables
    - git remote add github https://oauth2:${GITHUB_TOKEN}@${GITHUB_REPO_URL#https://}

    # Create local 'develop' branch pointing to current commit
    - git checkout -B develop

    # --- Rewrite GitLab submodule URLs to GitHub ---
    # Capture only the project name and prepend your GitHub username
    - sed -E -i 's#(git@|https://)gitlab.com[:/][^ ]*/([^/]+)\.git#https://github.com/sergio24duran/\2.git#g' .gitmodules

    # Stage and commit the modified .gitmodules (commit only exists in the mirror)
    - git add .gitmodules
    - git commit -m "Update submodule URLs for GitHub mirror" || true

    # Force push to GitHub
    - git push --force github develop
